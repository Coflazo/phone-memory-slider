name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tokens, protocol, and local-only boundaries
        shell: pwsh
        run: ./scripts/check-repository.ps1

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DPMS_BUILD_DESKTOP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark fixture catalog
        run: ./build/tools/Release/pms_benchmark.exe
        if: runner.os == 'Windows'

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 ninja-build
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DPMS_BUILD_DESKTOP=ON
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DPMS_BUILD_DESKTOP=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: phone-memory-slider-${{ runner.os }}
          path: PhoneMemorySlider-*.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and assemble companion
        working-directory: android-companion
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: phone-memory-slider-android-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
