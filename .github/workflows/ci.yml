name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tokens and zero-runtime-egress boundary
        shell: pwsh
        run: ./scripts/check-repository.ps1

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DPMS_BUILD_DESKTOP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark fixture catalog
        run: ./build/tools/Release/pms_benchmark.exe
        if: runner.os == 'Windows'

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 ninja-build
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DPMS_BUILD_DESKTOP=ON
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DPMS_BUILD_DESKTOP=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke-test desktop shell
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          PMS_SMOKE_TEST: '1'
        shell: pwsh
        run: |
          $binary = if ($IsWindows) {
            './build/Release/phone_memory_slider.exe'
          } elseif ($IsMacOS) {
            './build/desktop/phone_memory_slider.app/Contents/MacOS/phone_memory_slider'
          } else {
            './build/desktop/phone_memory_slider'
          }
          if (-not (Test-Path -LiteralPath $binary)) { throw "Desktop binary was not produced at $binary" }
          & $binary
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP
      - name: Check packaged offline boundary
        shell: pwsh
        run: |
          Get-ChildItem PhoneMemorySlider-*.zip | ForEach-Object {
            ./scripts/check-package.ps1 -Package $_.FullName
          }
      - name: Checksum package
        shell: pwsh
        run: |
          Get-ChildItem PhoneMemorySlider-*.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash *$($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phone-memory-slider-${{ runner.os }}
          path: |
            PhoneMemorySlider-*.zip
            PhoneMemorySlider-*.zip.sha256
